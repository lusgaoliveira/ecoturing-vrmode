<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Visualização 360° VR/AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      position: fixed;
      width: 100%;
      min-height: -webkit-fill-available;
      touch-action: none;
    }

    #controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 999;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
    }

    .control-btn {
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: rgba(0,0,0,0.7);
      color: white;
      cursor: pointer;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .control-btn:active {
      transform: scale(0.95);
      background: rgba(0,0,0,0.9);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #ar-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      background: black;
    }

    #ar-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #ar-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      text-align: center;
      max-width: 80%;
    }

    #vr-fake {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      background: black;
      overflow: hidden;
    }

    #vr-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .mode-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 12px;
      z-index: 998;
      backdrop-filter: blur(10px);
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 18px;
      z-index: 999;
    }
  </style>
</head>
<body>

<a-scene id="scene" vr-mode-ui="enabled:false" embedded>
  <a-assets>
    <img id="panorama" src="./Cantagalo.JPG" crossorigin="anonymous">
    <img id="temp1" src="./Cantagalo.JPG" crossorigin="anonymous">
    <img id="temp2" src="./Q360_20240713_135032_000001_Output.JPG" crossorigin="anonymous">
    <audio id="audio1" src="./tes1.mp3" preload="auto"></audio>
    <audio id="audio2" src="./tes2.mp3" preload="auto"></audio>
  </a-assets>

  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="mainCamera" look-controls="true" wasd-controls-enabled="false"></a-camera>
  </a-entity>

  <a-sky id="sky" src="#panorama" rotation="0 -90 0" visible="false"></a-sky>
  <a-sky id="sky-temp" src="#temp1" rotation="0 -90 0" visible="false"></a-sky>
</a-scene>

<div class="mode-indicator" id="mode-indicator">Modo: Normal</div>

<div id="controls-panel">
  <button class="control-btn" id="vr-btn">🕶️ Modo VR</button>
  <button class="control-btn" id="ar-btn">📱 AR (Câmera)</button>
  <button class="control-btn" id="360-btn">🌐 360° Imersivo</button>
  <button class="control-btn" id="exit-btn" style="display:none;">❌ Sair</button>
</div>

<!-- Modo VR iOS -->
<div id="vr-fake">
  <canvas id="vr-canvas"></canvas>
</div>

<!-- Modo AR -->
<div id="ar-container">
  <video id="ar-video" autoplay playsinline></video>
  <canvas id="ar-canvas"></canvas>
  <div id="ar-info">Mova o dispositivo para explorar em AR</div>
</div>

<!-- Modo 360° Imersivo -->
<div id="immersive-container" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:1000; background:black;">
  <canvas id="immersive-canvas"></canvas>
  <div id="immersive-info" style="position:absolute; top:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:10px 20px; border-radius:8px; font-size:14px; backdrop-filter:blur(10px);">
    Mova o dispositivo para explorar 360°
  </div>
</div>

<div class="loading" id="loading" style="display:none;">Carregando...</div>

<script>
window.addEventListener("load", () => {
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  
  const scene = document.getElementById("scene");
  const sky = document.getElementById("sky");
  const skyTemp = document.getElementById("sky-temp");
  const vrFake = document.getElementById("vr-fake");
  const arContainer = document.getElementById("ar-container");
  const immersiveContainer = document.getElementById("immersive-container");
  const modeIndicator = document.getElementById("mode-indicator");
  const loading = document.getElementById("loading");
  
  const vrBtn = document.getElementById("vr-btn");
  const arBtn = document.getElementById("ar-btn");
  const btn360 = document.getElementById("360-btn");
  const exitBtn = document.getElementById("exit-btn");
  const controlsPanel = document.getElementById("controls-panel");

  let currentMode = "normal"; // normal, vr, ar, immersive
  let arActive = false;
  let vrActive = false;
  let immersiveActive = false;

  // Carregamento do panorama
  scene.addEventListener("loaded", () => {
    const panorama = document.getElementById("panorama");
    if(panorama.complete){
      sky.setAttribute("visible", "true");
    } else {
      panorama.addEventListener("load", () => sky.setAttribute("visible", "true"));
    }
  });

  // Permissões de sensores (iOS 13+)
  async function requestSensorPermissions(){
    if(typeof DeviceMotionEvent?.requestPermission === "function"){
      try { 
        const response = await DeviceMotionEvent.requestPermission();
        console.log('DeviceMotion permission:', response);
        return response === 'granted';
      } catch(e) { 
        console.warn('DeviceMotion permission denied:', e);
        return false;
      }
    }
    if(typeof DeviceOrientationEvent?.requestPermission === "function"){
      try { 
        const response = await DeviceOrientationEvent.requestPermission();
        console.log('DeviceOrientation permission:', response);
        return response === 'granted';
      } catch(e) { 
        console.warn('DeviceOrientation permission denied:', e);
        return false;
      }
    }
    return true;
  }

  // Sequência temporária de panoramas
  const panoramasTemp = [
    { img: "#temp1", audio: document.getElementById("audio1") },
    { img: "#temp2", audio: document.getElementById("audio2") }
  ];
  let currentTempIndex = 0;

  function playTemporarySequence() {
    if(currentTempIndex >= panoramasTemp.length){
      skyTemp.setAttribute("visible", "false");
      return;
    }

    const pano = panoramasTemp[currentTempIndex];
    skyTemp.setAttribute("src", pano.img);
    skyTemp.setAttribute("visible", "true");
    if(pano.audio) pano.audio.play();

    setTimeout(() => {
      if(pano.audio){
        pano.audio.pause();
        pano.audio.currentTime = 0;
      }
      currentTempIndex++;
      playTemporarySequence();
    }, 30000);
  }
  setTimeout(playTemporarySequence, 5000);

  // =============================
  // MODO 360° IMERSIVO (SEM CÂMERA)
  // =============================
  async function start360Mode() {
    if(immersiveActive) return;

    loading.style.display = "block";
    
    try {
      // Solicitar permissões de sensores
      const hasPermission = await requestSensorPermissions();
      if(!hasPermission && isIOS){
        alert("É necessário permitir acesso aos sensores para o modo 360°");
        loading.style.display = "none";
        return;
      }

      // Configurar canvas 360°
      const canvas = document.getElementById("immersive-canvas");
      const ctx = canvas.getContext("2d");
      
      function resize360Canvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize360Canvas();
      window.addEventListener("resize", resize360Canvas);

      // Mostrar container 360°
      immersiveContainer.style.display = "block";
      scene.style.display = "none";
      controlsPanel.style.display = "none";
      exitBtn.style.display = "block";
      modeIndicator.textContent = "Modo: 360° Imersivo";

      immersiveActive = true;
      currentMode = "immersive";
      loading.style.display = "none";

      // Setup Three.js
      const renderer = new THREE.WebGLRenderer({ 
        canvas: canvas, 
        antialias: true 
      });
      renderer.setSize(canvas.width, canvas.height);
      renderer.setPixelRatio(window.devicePixelRatio || 1);

      // Cena 3D
      const scene3D = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
      camera.position.set(0, 0, 0);

      // Esfera 360° invertida
      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1);

      // Carregar textura
      const textureLoader = new THREE.TextureLoader();
      const texture = textureLoader.load('./Cantagalo.JPG');
      
      const material = new THREE.MeshBasicMaterial({ 
        map: texture,
        side: THREE.BackSide
      });
      
      const sphere = new THREE.Mesh(geometry, material);
      sphere.rotation.y = -Math.PI / 2;
      scene3D.add(sphere);

      // Controle de orientação
      let alpha = 0, beta = 0, gamma = 0;
      let hasOrientation = false;
      let initialAlpha = null;

      function handleOrientation(event) {
        if (event.alpha !== null) {
          if (!hasOrientation) {
            hasOrientation = true;
            initialAlpha = event.alpha;
          }
          alpha = event.alpha;
          beta = event.beta;
          gamma = event.gamma;
        }
      }

      window.addEventListener("deviceorientation", handleOrientation, true);

      // Loop de renderização
      function immersiveLoop() {
        if (!immersiveActive) return;

        if (hasOrientation) {
          const alphaRad = THREE.MathUtils.degToRad(alpha || 0);
          const betaRad = THREE.MathUtils.degToRad(beta || 0);
          const gammaRad = THREE.MathUtils.degToRad(gamma || 0);

          const euler = new THREE.Euler(betaRad, alphaRad, -gammaRad, 'YXZ');
          camera.quaternion.setFromEuler(euler);
          
          if (initialAlpha !== null) {
            const offsetY = THREE.MathUtils.degToRad(initialAlpha);
            camera.rotateY(-offsetY);
          }
        }

        renderer.render(scene3D, camera);
        requestAnimationFrame(immersiveLoop);
      }

      immersiveLoop();

      // Handler de resize
      const immersiveResizeHandler = () => {
        resize360Canvas();
        camera.aspect = canvas.width / canvas.height;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.width, canvas.height);
      };
      window.addEventListener("resize", immersiveResizeHandler);

      // Cleanup
      window.stop360Mode = () => {
        immersiveActive = false;
        window.removeEventListener("resize", immersiveResizeHandler);
        window.removeEventListener("resize", resize360Canvas);
        window.removeEventListener("deviceorientation", handleOrientation);
        
        immersiveContainer.style.display = "none";
        scene.style.display = "block";
        controlsPanel.style.display = "flex";
        exitBtn.style.display = "none";
        modeIndicator.textContent = "Modo: Normal";
        currentMode = "normal";
        
        geometry.dispose();
        material.dispose();
        texture.dispose();
        renderer.dispose();
      };

    } catch(error) {
      console.error("Erro ao iniciar modo 360°:", error);
      alert("Não foi possível iniciar o modo 360°");
      loading.style.display = "none";
      immersiveActive = false;
    }
  }

  // =============================
  // MODO AR - CÂMERA + PANORAMA
  // =============================
  async function startARMode() {
    if(arActive) return;

    loading.style.display = "block";
    
    try {
      // Solicitar permissões primeiro
      const hasPermission = await requestSensorPermissions();
      if(!hasPermission && isIOS){
        alert("É necessário permitir acesso aos sensores para usar o modo AR");
        loading.style.display = "none";
        return;
      }

      // Solicitar câmera traseira
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment', // câmera traseira
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      const video = document.getElementById("ar-video");
      video.srcObject = stream;
      await video.play();

      // Configurar canvas AR
      const canvas = document.getElementById("ar-canvas");
      const ctx = canvas.getContext("2d");
      
      function resizeARCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeARCanvas();
      window.addEventListener("resize", resizeARCanvas);

      // Mostrar container AR
      arContainer.style.display = "block";
      scene.style.display = "none";
      controlsPanel.style.display = "none";
      exitBtn.style.display = "block";
      modeIndicator.textContent = "Modo: AR";

      arActive = true;
      currentMode = "ar";
      loading.style.display = "none";

      // Setup Three.js para renderizar panorama sobre o vídeo
      const renderer = new THREE.WebGLRenderer({ 
        canvas: canvas, 
        alpha: true,
        antialias: true 
      });
      renderer.setSize(canvas.width, canvas.height);
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setClearColor(0x000000, 0); // transparente

      // Cena 3D do panorama
      const scene3D = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);
      camera.position.set(0, 0, 0);

      // Esfera invertida para panorama 360°
      const geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1); // inverter para ver de dentro

      // Carregar textura do panorama
      const textureLoader = new THREE.TextureLoader();
      const texture = textureLoader.load('./Cantagalo.JPG');
      
      // Material com transparência ajustável
      const material = new THREE.MeshBasicMaterial({ 
        map: texture,
        transparent: true,
        opacity: 0.85, // 0.85 = mais panorama, menos câmera | 0.5 = mix 50/50
        side: THREE.BackSide,
        depthWrite: false
      });
      
      const sphere = new THREE.Mesh(geometry, material);
      sphere.rotation.y = -Math.PI / 2; // ajuste de rotação inicial
      scene3D.add(sphere);
      
      // Adicionar controle de opacidade por gestos (opcional)
      let touchStartY = 0;
      canvas.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      });
      
      canvas.addEventListener('touchmove', (e) => {
        const touchY = e.touches[0].clientY;
        const delta = (touchStartY - touchY) / window.innerHeight;
        material.opacity = Math.max(0.3, Math.min(1.0, material.opacity + delta * 0.5));
        touchStartY = touchY;
        
        // Atualizar info
        document.getElementById('ar-info').textContent = 
          `AR Mode | Opacidade: ${Math.round(material.opacity * 100)}% | Deslize verticalmente para ajustar`;
      });

      // Controle de orientação com quaternion adequado
      let alpha = 0, beta = 0, gamma = 0;
      let hasOrientation = false;
      let initialAlpha = null;

      function handleOrientation(event) {
        if (event.alpha !== null) {
          if (!hasOrientation) {
            hasOrientation = true;
            initialAlpha = event.alpha; // salvar orientação inicial
          }
          alpha = event.alpha;
          beta = event.beta;
          gamma = event.gamma;
        }
      }

      window.addEventListener("deviceorientation", handleOrientation, true);

      // Loop de renderização AR
      function arLoop() {
        if (!arActive) return;

        // Atualizar câmera baseado na orientação do dispositivo
        if (hasOrientation) {
          // Converter para radianos
          const alphaRad = THREE.MathUtils.degToRad(alpha || 0);
          const betaRad = THREE.MathUtils.degToRad(beta || 0);
          const gammaRad = THREE.MathUtils.degToRad(gamma || 0);

          // Aplicar rotação correta para iOS/Android
          // YXZ ordem para device orientation
          const euler = new THREE.Euler(betaRad, alphaRad, -gammaRad, 'YXZ');
          camera.quaternion.setFromEuler(euler);
          
          // Ajuste fino para compensar orientação inicial
          if (initialAlpha !== null) {
            const offsetY = THREE.MathUtils.degToRad(initialAlpha);
            camera.rotateY(-offsetY);
          }
        }

        // Renderizar panorama sobre o vídeo
        renderer.render(scene3D, camera);

        requestAnimationFrame(arLoop);
      }

      arLoop();

      // Handler de resize
      const arResizeHandler = () => {
        resizeARCanvas();
        camera.aspect = canvas.width / canvas.height;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.width, canvas.height);
      };
      window.addEventListener("resize", arResizeHandler);

      // Cleanup function
      window.stopARMode = () => {
        arActive = false;
        window.removeEventListener("resize", arResizeHandler);
        window.removeEventListener("deviceorientation", handleOrientation);
        
        if(stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        
        arContainer.style.display = "none";
        scene.style.display = "block";
        controlsPanel.style.display = "flex";
        exitBtn.style.display = "none";
        modeIndicator.textContent = "Modo: Normal";
        currentMode = "normal";
        
        // Limpar Three.js
        geometry.dispose();
        material.dispose();
        texture.dispose();
        renderer.dispose();
      };

    } catch(error) {
      console.error("Erro ao iniciar AR:", error);
      alert("Não foi possível acessar a câmera. Certifique-se de permitir o acesso.");
      loading.style.display = "none";
      arActive = false;
    }
  }

  // =============================
  // MODO VR COM BARREL DISTORTION
  // =============================
  const DistortionShader = {
    uniforms: {
      "tDiffuse": { value: null },
      "k1": { value: 0.22 },
      "k2": { value: 0.05 },
      "aspect": { value: 1.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D tDiffuse;
      uniform float k1;
      uniform float k2;
      uniform float aspect;

      void main() {
        vec2 uv = vUv * 2.0 - 1.0;
        uv.x *= aspect;

        float r2 = uv.x*uv.x + uv.y*uv.y;
        float factor = 1.0 + k1 * r2 + k2 * r2 * r2;

        vec2 distorted = uv * factor;
        distorted.x /= aspect;
        vec2 sampleUV = (distorted + 1.0) * 0.5;

        if(sampleUV.x < 0.0 || sampleUV.x > 1.0 || sampleUV.y < 0.0 || sampleUV.y > 1.0) {
          gl_FragColor = vec4(0.0,0.0,0.0,1.0);
        } else {
          gl_FragColor = texture2D(tDiffuse, sampleUV);
        }
      }
    `
  };

  function createDistortionQuad(renderTarget, aspect, k1=0.22, k2=0.05) {
    const quadScene = new THREE.Scene();
    const quadCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const geometry = new THREE.PlaneBufferGeometry(2,2);
    const material = new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.clone(DistortionShader.uniforms),
      vertexShader: DistortionShader.vertexShader,
      fragmentShader: DistortionShader.fragmentShader,
      depthTest: false,
      depthWrite: false
    });
    material.uniforms.tDiffuse.value = renderTarget.texture;
    material.uniforms.k1.value = k1;
    material.uniforms.k2.value = k2;
    material.uniforms.aspect.value = aspect;

    const mesh = new THREE.Mesh(geometry, material);
    quadScene.add(mesh);

    return { scene: quadScene, camera: quadCamera, material };
  }

  function updateCameraFromDeviceOrientation(camera, alpha, beta, gamma) {
    if (alpha === null || beta === null || gamma === null) return;

    const deg2rad = Math.PI / 180;
    const _alpha = alpha * deg2rad;
    const _beta = beta * deg2rad;
    const _gamma = gamma * deg2rad;

    const euler = new THREE.Euler();
    euler.set(_beta, _alpha, -_gamma, 'YXZ');
    camera.quaternion.setFromEuler(euler);
  }

  async function startVRMode() {
    if(vrActive) return;

    const hasPermission = await requestSensorPermissions();
    if(!hasPermission && isIOS){
      alert("É necessário permitir acesso aos sensores para usar o modo VR");
      return;
    }

    if(isIOS || isSafari) {
      // iOS VR com barrel distortion
      vrFake.style.display = "block";
      scene.style.display = "none";
      controlsPanel.style.display = "none";
      exitBtn.style.display = "block";
      modeIndicator.textContent = "Modo: VR (iOS)";

      vrActive = true;
      currentMode = "vr";

      const canvas = document.getElementById("vr-canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ 
        canvas: canvas, 
        antialias: true, 
        alpha: false 
      });
      renderer.setSize(canvas.width, canvas.height);
      renderer.setPixelRatio(window.devicePixelRatio || 1);

      const scene3D = scene.object3D;
      const widthHalf = Math.floor(canvas.width / 2);
      const height = canvas.height;
      const aspect = widthHalf / height;

      const FOV = 90;
      const cameraLeft = new THREE.PerspectiveCamera(FOV, aspect, 0.1, 1000);
      const cameraRight = new THREE.PerspectiveCamera(FOV, aspect, 0.1, 1000);

      cameraLeft.position.set(-0.032, 0, 0);
      cameraRight.position.set(0.032, 0, 0);

      const rtParams = { 
        minFilter: THREE.LinearFilter, 
        magFilter: THREE.LinearFilter, 
        format: THREE.RGBAFormat 
      };
      const rtLeft = new THREE.WebGLRenderTarget(widthHalf, height, rtParams);
      const rtRight = new THREE.WebGLRenderTarget(widthHalf, height, rtParams);

      const quadLeft = createDistortionQuad(rtLeft, aspect, 0.22, 0.05);
      const quadRight = createDistortionQuad(rtRight, aspect, 0.22, 0.05);

      function vrLoop() {
        if(!vrActive) return;

        renderer.setRenderTarget(rtLeft);
        renderer.clear();
        renderer.render(scene3D, cameraLeft);

        renderer.setRenderTarget(rtRight);
        renderer.clear();
        renderer.render(scene3D, cameraRight);

        renderer.setRenderTarget(null);
        renderer.clear();

        renderer.setViewport(0, 0, widthHalf, height);
        renderer.setScissor(0, 0, widthHalf, height);
        renderer.setScissorTest(true);
        renderer.render(quadLeft.scene, quadLeft.camera);

        renderer.setViewport(widthHalf, 0, widthHalf, height);
        renderer.setScissor(widthHalf, 0, widthHalf, height);
        renderer.render(quadRight.scene, quadRight.camera);

        renderer.setScissorTest(false);

        requestAnimationFrame(vrLoop);
      }

      const orientationHandler = (e) => {
        updateCameraFromDeviceOrientation(cameraLeft, e.alpha, e.beta, e.gamma);
        updateCameraFromDeviceOrientation(cameraRight, e.alpha, e.beta, e.gamma);
      };

      window.addEventListener("deviceorientation", orientationHandler, true);

      vrLoop();

      // Tentar fullscreen
      setTimeout(() => {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(e => console.log(e));
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      }, 100);

      const resizeHandler = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const newWidthHalf = Math.floor(canvas.width / 2);
        const newHeight = canvas.height;
        const newAspect = newWidthHalf / newHeight;

        renderer.setSize(canvas.width, canvas.height);
        renderer.setPixelRatio(window.devicePixelRatio || 1);

        rtLeft.setSize(newWidthHalf, newHeight);
        rtRight.setSize(newWidthHalf, newHeight);

        quadLeft.material.uniforms.aspect.value = newAspect;
        quadRight.material.uniforms.aspect.value = newAspect;

        cameraLeft.aspect = newAspect;
        cameraLeft.updateProjectionMatrix();
        cameraRight.aspect = newAspect;
        cameraRight.updateProjectionMatrix();
      };

      window.addEventListener("resize", resizeHandler);

      window.stopVRMode = () => {
        vrActive = false;
        window.removeEventListener("resize", resizeHandler);
        window.removeEventListener("deviceorientation", orientationHandler);
        
        vrFake.style.display = "none";
        scene.style.display = "block";
        controlsPanel.style.display = "flex";
        exitBtn.style.display = "none";
        modeIndicator.textContent = "Modo: Normal";
        currentMode = "normal";
        
        renderer.dispose();
        rtLeft.dispose();
        rtRight.dispose();
      };

    } else {
      // Android / WebXR nativo
      if(scene && typeof scene.enterVR === "function"){
        try { 
          await scene.enterVR();
          vrActive = true;
          currentMode = "vr";
          modeIndicator.textContent = "Modo: VR";
        } catch(err){ 
          console.warn('enterVR error:', err);
          alert("Seu navegador não suporta WebVR");
        }
      }
    }
  }

  // Event listeners dos botões
  vrBtn.addEventListener("click", startVRMode);
  arBtn.addEventListener("click", startARMode);
  btn360.addEventListener("click", start360Mode);
  
  exitBtn.addEventListener("click", () => {
    if(currentMode === "ar" && window.stopARMode) {
      window.stopARMode();
    } else if(currentMode === "vr" && window.stopVRMode) {
      window.stopVRMode();
    } else if(currentMode === "immersive" && window.stop360Mode) {
      window.stop360Mode();
    }
  });

});
</script>

</body>
</html>
